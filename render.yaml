services:
  - type: worker
    name: emma-dictatrice
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PANEL_ROLE_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: PUNISHMENT_ROLE_ID
        sync: false
